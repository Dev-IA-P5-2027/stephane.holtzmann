name: Update Weather Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r CI_CD/requirements.txt

      - name: Run weather update script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python CI_CD/update_weather.py

      